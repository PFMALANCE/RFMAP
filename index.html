<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RP Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ctrl-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      opacity: 0.9;
    }
    .ctrl-btn.active   { opacity: 1; outline: 3px solid #fff; }
    .ctrl-btn.inactive { opacity: 0.4; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
  <button class="ctrl-btn active" style="background:#a855f7;color:#fff"
          onclick="toggleLayer('drugcollection', this)">🪻 薬物採取</button>
  <button class="ctrl-btn active" style="background:#ec4899;color:#fff"
          onclick="toggleLayer('druglab', this)">🧪 薬物生成所</button>
  <button class="ctrl-btn active" style="background:#f97316;color:#fff"
          onclick="toggleLayer('drugdealer', this)">🧍 薬物売人</button>
  <button class="ctrl-btn active" style="background:#ef4444;color:#fff"
          onclick="toggleLayer('crime', this)">☠️ 犯罪現場</button>
  <button class="ctrl-btn active" style="background:#eab308;color:#fff"
          onclick="toggleLayer('exchange', this)">💰 換金所</button>
  <button class="ctrl-btn active" style="background:#64748b;color:#fff"
          onclick="toggleLayer('ganghideout', this)">🏰 ギャングアジト</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

const imageWidth  = 4000;
const imageHeight = 6000;

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2
});

const bounds = [[0, 0], [imageHeight, imageWidth]];
L.imageOverlay('rfmap.jpg', bounds).addTo(map);
map.fitBounds(bounds);

const layers = {
  drugcollection: L.layerGroup().addTo(map),
  druglab:        L.layerGroup().addTo(map),
  drugdealer:     L.layerGroup().addTo(map),
  crime:          L.layerGroup().addTo(map),
  exchange:       L.layerGroup().addTo(map),
  ganghideout:    L.layerGroup().addTo(map),
};

function addPin(layerName, y, x, title, detail) {
  L.marker([y, x])
    .bindPopup(`<b>${title}</b><br>${detail}`)
    .addTo(layers[layerName]);
}

// ===========================
//   座標確認クリック機能
// ===========================

map.on('click', function(e) {
  var y = Math.round(e.latlng.lat);
  var x = Math.round(e.latlng.lng);
  L.popup()
    .setLatLng(e.latlng)
    .setContent('y: ' + y + ', x: ' + x)
    .openOn(map);
});

function toggleLayer(name, btn) {
  if (map.hasLayer(layers[name])) {
    map.removeLayer(layers[name]);
    btn.classList.replace('active', 'inactive');
  } else {
    layers[name].addTo(map);
    btn.classList.replace('inactive', 'active');
  }
}
