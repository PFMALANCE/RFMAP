<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RF Town Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ctrl-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      opacity: 0.9;
    }
    .ctrl-btn.active   { opacity: 1; outline: 3px solid #fff; }
    .ctrl-btn.inactive { opacity: 0.4; }
    #stats-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 200px;
      display: none;
    }
    #stats-panel h3 { margin: 0 0 10px; font-size: 15px; }
    #stats-panel .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    #stats-panel .stat-val { font-weight: bold; color: #ef4444; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
  <button class="ctrl-btn active" style="background:#a855f7;color:#fff"
          onclick="toggleLayer('drugcollection', this)">🪻 薬物採取🔒</button>
  <button class="ctrl-btn active" style="background:#ec4899;color:#fff"
          onclick="toggleLayer('druglab', this)">🧪 薬物生成所🔒</button>
  <button class="ctrl-btn active" style="background:#f97316;color:#fff"
          onclick="toggleLayer('drugdealer', this)">🧍 薬物売人🔒</button>
  <button class="ctrl-btn active" style="background:#ef4444;color:#fff"
          onclick="toggleLayer('crime', this)">☠️ 犯罪現場</button>
  <button class="ctrl-btn active" style="background:#eab308;color:#fff"
          onclick="toggleLayer('exchange', this)">💰 換金所</button>
  <button class="ctrl-btn active" style="background:#64748b;color:#fff"
          onclick="toggleLayer('ganghideout', this)">🏰 ギャングアジト</button>

  <div style="border-top:1px solid rgba(255,255,255,0.3);margin:4px 0;"></div>

  <button id="wanted-btn" class="ctrl-btn" style="background:#ef4444;color:#fff"
          onclick="toggleWantedMode()">🔴 指名手配記録</button>
  <button id="heat-btn" class="ctrl-btn" style="background:#f97316;color:#fff;opacity:0.4" data-on="false"
          onclick="toggleHeat()">🌡️ ヒートマップ</button>
  <button class="ctrl-btn" style="background:#1e293b;color:#fff"
          onclick="toggleStats()">📊 統計</button>
</div>

<div id="stats-panel">
  <h3>📊 指名手配 統計</h3>
  <div class="stat-row">
    <span>総発見数</span>
    <span class="stat-val" id="stats-count">0</span>
  </div>
  <div class="stat-row">
    <span>最多時間帯</span>
    <span class="stat-val" id="stats-peak">-</span>
  </div>
</div>

  // ===========================
  //   パスワード照合
  // ===========================
  let drugUnlocked = false;
  const drugGroups = ['drugcollection', 'druglab', 'drugdealer'];

  function toggleLayer(name, btn) {
    if (drugGroups.includes(name) && !drugUnlocked) {
      const input = prompt('パスワードを入力してください');
      if (input === null) return;

      // Firebaseのconfigと照合
      db.ref('config/drugPassword').once('value').then(function(snapshot) {
        const correct = snapshot.val();
        if (input === correct) {
          drugUnlocked = true;
          // 認証成功後にレイヤーを切り替える
          doToggleLayer(name, btn);
        } else {
          alert('パスワードが違います');
        }
      });
      return;
    }
    doToggleLayer(name, btn);
  }

  function doToggleLayer(name, btn) {
    if (map.hasLayer(layers[name])) {
      map.removeLayer(layers[name]);
      btn.classList.replace('active', 'inactive');
    } else {
      layers[name].addTo(map);
      btn.classList.replace('inactive', 'active');
    }
  }

  // 指名手配記録
  let wantedMode = false;
  let heatLayer = null;
  let wantedMarkers = {};
  let allWantedData = {};

  function toggleWantedMode() {
    wantedMode = !wantedMode;
    const btn = document.getElementById('wanted-btn');
    if (wantedMode) {
      btn.style.outline = '3px solid #fff';
      btn.textContent = '🔴 記録モードON';
      map.getContainer().style.cursor = 'crosshair';
    } else {
      btn.style.outline = 'none';
      btn.textContent = '🔴 指名手配記録';
      map.getContainer().style.cursor = '';
    }
  }

  map.on('click', function(e) {
    if (!wantedMode) {
      var y = Math.round(e.latlng.lat);
      var x = Math.round(e.latlng.lng);
      L.popup()
        .setLatLng(e.latlng)
        .setContent('y: ' + y + ', x: ' + x)
        .openOn(map);
      return;
    }
    const timestamp = new Date().toLocaleString('ja-JP');
    wantedRef.push({ y: e.latlng.lat, x: e.latlng.lng, time: timestamp });
    wantedMode = false;
    toggleWantedMode();
  });

  wantedRef.on('value', function(snapshot) {
    allWantedData = snapshot.val() || {};

    Object.values(wantedMarkers).forEach(function(m) { map.removeLayer(m); });
    wantedMarkers = {};

    const heatData = [];

    Object.entries(allWantedData).forEach(function([key, data]) {
      const marker = L.circleMarker([data.y, data.x], {
        radius: 8,
        fillColor: '#ef4444',
        color: '#fff',
        weight: 2,
        fillOpacity: 0.9
      }).bindPopup(
        '<b>発見記録</b><br>時刻: ' + data.time +
        '<br><button onclick="deleteWanted(\'' + key + '\')" ' +
        'style="margin-top:6px;padding:4px 10px;background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer">削除</button>'
      ).addTo(map);

      wantedMarkers[key] = marker;
      heatData.push([data.y, data.x, 1]);
    });

    if (heatLayer) map.removeLayer(heatLayer);
    if (heatData.length > 0) {
      heatLayer = L.heatLayer(heatData, {
        radius: 60,
        blur: 40,
        maxZoom: 2,
        gradient: { 0.4: 'blue', 0.6: 'yellow', 0.8: 'orange', 1.0: 'red' }
      });
      if (document.getElementById('heat-btn').dataset.on === 'true') {
        heatLayer.addTo(map);
      }
    }

    updateStats();
  });

  function deleteWanted(key) {
    db.ref('wanted/' + key).remove();
  }

  function updateStats() {
    const count = Object.keys(allWantedData).length;
    document.getElementById('stats-count').textContent = count;

    const hourMap = {};
    Object.values(allWantedData).forEach(function(d) {
      const hour = d.time ? d.time.split(' ')[1].split(':')[0] + '時台' : '不明';
      hourMap[hour] = (hourMap[hour] || 0) + 1;
    });
    const top = Object.entries(hourMap).sort(function(a, b) { return b[1] - a[1]; })[0];
    document.getElementById('stats-peak').textContent = top ? top[0] + '（' + top[1] + '件）' : '-';
  }

  function toggleHeat() {
    const btn = document.getElementById('heat-btn');
    if (btn.dataset.on === 'true') {
      if (heatLayer) map.removeLayer(heatLayer);
      btn.dataset.on = 'false';
      btn.style.opacity = '0.4';
    } else {
      if (heatLayer) heatLayer.addTo(map);
      btn.dataset.on = 'true';
      btn.style.opacity = '1';
    }
  }

  function toggleStats() {
    const panel = document.getElementById('stats-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
