<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

window.addEventListener('DOMContentLoaded', () => {

  const firebaseConfig = {
    apiKey: "AIzaSyC2yZD6koC2StXCf4VH-9S_2mO9y7eH6po",
    authDomain: "rftown-wanted-analysis.firebaseapp.com",
    databaseURL: "https://rftown-wanted-analysis-default-rtdb.firebaseio.com",
    projectId: "rftown-wanted-analysis",
    storageBucket: "rftown-wanted-analysis.firebasestorage.app",
    messagingSenderId: "450886207660",
    appId: "1:450886207660:web:f1d50ff08970eca5bcf709"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const wantedRef = ref(db, 'wanted');

  const imageWidth  = 4000;
  const imageHeight = 6000;

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2
  });

  const bounds = [[0, 0], [imageHeight, imageWidth]];
  L.imageOverlay('./rfmap.jpg', bounds).addTo(map);
  map.fitBounds(bounds);

  // -----------------------------
  // Layers
  // -----------------------------
  const layers = {
    drugcollection: L.layerGroup().addTo(map),
    druglab:        L.layerGroup().addTo(map),
    drugdealer:     L.layerGroup().addTo(map),
    crime:          L.layerGroup().addTo(map),
    exchange:       L.layerGroup().addTo(map),
    ganghideout:    L.layerGroup().addTo(map),
  };

  function addPin(layerName, y, x, title, detail) {
    L.marker([y, x])
      .bindPopup(`<b>${title}</b><br>${detail}`)
      .addTo(layers[layerName]);
  }

  // -----------------------------
  // Pins（そのまま）
  // -----------------------------
  addPin('drugcollection', 400, 600, 'オウムポピー', 'a');
  addPin('drugcollection', 400, 600, 'エクスタシー', 'a');
  addPin('drugcollection', 400, 600, '水酸化ナトリウム', 'a');
  addPin('drugcollection', 400, 600, '精製水', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');
  addPin('drugcollection', 400, 600, '採取②', 'a');

  addPin('druglab', 400, 600, '生成所①', 'a');
  addPin('druglab', 400, 600, '生成所②', 'a');

  addPin('drugdealer', 400, 600, '売人①', 'a');
  addPin('drugdealer', 400, 600, '売人②', 'a');

  addPin('crime', 1103, 1788, 'アーティファクト', '大型');
  addPin('crime', 4522, 3540, 'バージ', '大型');
  addPin('crime', 892, 1365, '飛行場', '大型');
  addPin('crime', 5176, 756, 'オイルリグ', '大型');
  addPin('crime', 1977, 1837, 'ユニオン', '大型');
  addPin('crime', 2221, 2261, 'アングラ', '大型');
  addPin('crime', 2063, 1236, 'メイズバンク', '大型');
  addPin('crime', 2015, 1609, '大型金庫', '大型');
  addPin('crime', 2966, 2994, 'トレイン', '大型');
  addPin('crime', 1352, 2238, 'ボブキャット', '大型');
  addPin('crime', 2326, 2288, 'カジノ', '超大型');
  addPin('crime', 2369, 1956, 'パシフィック', '超大型');

  // （中略：あなたの残り全部そのままOK）
  // ※省略せず入れて問題なし

  // -----------------------------
  // Layer toggle
  // -----------------------------
  function toggleLayer(name, btn) {
    if (map.hasLayer(layers[name])) {
      map.removeLayer(layers[name]);
      btn.classList.replace('active', 'inactive');
    } else {
      layers[name].addTo(map);
      btn.classList.replace('inactive', 'active');
    }
  }
  window.toggleLayer = toggleLayer;

  // -----------------------------
  // Wanted system
  // -----------------------------
  let wantedMode = false;
  let heatLayer = null;
  let wantedMarkers = {};
  let allWantedData = {};

  window.toggleWantedMode = function () {
    wantedMode = !wantedMode;
    const btn = document.getElementById('wanted-btn');

    if (wantedMode) {
      btn.style.outline = '3px solid #fff';
      btn.textContent = '🔴 記録モードON';
      map.getContainer().style.cursor = 'crosshair';
    } else {
      btn.style.outline = 'none';
      btn.textContent = '🔴 指名手配記録';
      map.getContainer().style.cursor = '';
    }
  };

  map.on('click', function (e) {
    if (!wantedMode) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);

      L.popup()
        .setLatLng(e.latlng)
        .setContent(`y: ${y}, x: ${x}`)
        .openOn(map);
      return;
    }

    const y = e.latlng.lat;
    const x = e.latlng.lng;
    const timestamp = new Date().toLocaleString('ja-JP');

    push(wantedRef, { y, x, time: timestamp });

    wantedMode = false;
    window.toggleWantedMode();
  });

  onValue(wantedRef, (snapshot) => {
    allWantedData = snapshot.val() || {};

    Object.values(wantedMarkers).forEach(m => map.removeLayer(m));
    wantedMarkers = {};

    const heatData = [];

    Object.entries(allWantedData).forEach(([key, data]) => {
      const marker = L.circleMarker([data.y, data.x], {
        radius: 8,
        fillColor: '#ef4444',
        color: '#fff',
        weight: 2,
        fillOpacity: 0.9
      }).bindPopup(`
        <b>発見記録</b><br>
        時刻: ${data.time}<br>
        <button onclick="deleteWanted('${key}')">
          削除
        </button>
      `).addTo(map);

      wantedMarkers[key] = marker;
      heatData.push([data.y, data.x, 1]);
    });

    if (heatLayer) map.removeLayer(heatLayer);

    if (heatData.length > 0) {
      heatLayer = L.heatLayer(heatData, {
        radius: 60,
        blur: 40,
        maxZoom: 2,
        gradient: { 0.4: 'blue', 0.6: 'yellow', 0.8: 'orange', 1.0: 'red' }
      });

      if (document.getElementById('heat-btn').dataset.on === 'true') {
        heatLayer.addTo(map);
      }
    }

    updateStats();
  });

  window.deleteWanted = function (key) {
    remove(ref(db, 'wanted/' + key));
  };

  function updateStats() {
    const count = Object.keys(allWantedData).length;
    document.getElementById('stats-count').textContent = count;

    const hourMap = {};
    Object.values(allWantedData).forEach(d => {
      const hour = d.time
        ? d.time.split(' ')[1]?.split(':')[0] + '時台'
        : '不明';

      hourMap[hour] = (hourMap[hour] || 0) + 1;
    });

    const top = Object.entries(hourMap).sort((a, b) => b[1] - a[1])[0];
    document.getElementById('stats-peak').textContent =
      top ? `${top[0]}（${top[1]}件）` : '-';
  }

  window.toggleHeat = function () {
    const btn = document.getElementById('heat-btn');

    if (btn.dataset.on === 'true') {
      if (heatLayer) map.removeLayer(heatLayer);
      btn.dataset.on = 'false';
      btn.style.opacity = '0.4';
    } else {
      if (heatLayer) heatLayer.addTo(map);
      btn.dataset.on = 'true';
      btn.style.opacity = '1';
    }
  };

  window.toggleStats = function () {
    const panel = document.getElementById('stats-panel');
    panel.style.display =
      panel.style.display === 'none' ? 'block' : 'none';
  };

}); // DOMContentLoaded end
</script>
